spring.application.name=chinook-spring

# --- Conexión (los mismos datos de la PG1) ---
spring.datasource.url=jdbc:mariadb://localhost:3306/chinook
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate ---
# none: Hibernate NO toca las tablas, Chinook ya existe
spring.jpa.hibernate.ddl-auto=none
# Ponlo en true para ver el SQL que genera Spring Data (muy útil en los pasos 4 y 5)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Usar los nombres de @Table y @Column tal cual (Spring Boot, por defecto, los pasaría a minúsculas con guiones bajos)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Consola limpia: solo lo que escribimos con println ---
spring.main.banner-mode=off
logging.level.root=WARN

# --- Web (PG 3.1) ---
# Con logging.level.root=WARN no se ve el arranque de Tomcat: esta línea muestra "Tomcat started on port 8080"
logging.level.org.springframework.boot.tomcat=INFO